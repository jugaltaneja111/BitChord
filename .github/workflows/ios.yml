name: iOS

# Only the Linux job runs on every push. It compiles the iOS klibs, which catches most breakage.
# The macOS jobs run only when started by hand, or (the app) for an `ios-v*` tag, and start beside
# the Linux job rather than after it.
on:
  push:
    branches: [main, ios-port]
    # Path filters do not apply to tags: an ios-v* tag always builds.
    tags: ['ios-v*']
    paths:
      - 'shared/**'
      - 'sharedUi/**'
      - 'iosKit/**'
      - 'iosApp/**'
      # Automix's analyzer, which the app builds as BitChordAnalysis.framework.
      - 'native/analyzer/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Build the unsigned IPA on macOS'
        type: boolean
        default: true
      smoke:
        description: 'Launch the app on the simulator and play a track (macOS)'
        type: boolean
        default: false
      release:
        # One fixed pre-release, replaced each time: the newest IPA at a link that never changes,
        # releases/download/ios-latest/BitChord-unsigned.ipa. Never marked Latest, which stays
        # the Android app's.
        description: 'Publish the IPA to the branch pre-release (ios-latest for ios-port)'
        type: boolean
        default: true
      tests:
        description: 'Run the shared tests on the iOS simulator (macOS)'
        type: boolean
        default: false
      runner:
        # GitHub's Apple-silicon pool sometimes has no machine to give for hours. The Intel one is
        # separate and builds the same device IPA, but has no arm64 simulator, so no smoke run.
        description: 'macOS machine for the IPA (Intel builds the IPA only, without the smoke run)'
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

concurrency:
  # Per event, so a push's Linux check never cancels a dispatched IPA build.
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compile:
    name: Shared · iOS compile (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # The app's BitChordAnalysis.framework is only built on macOS, by the IPA job. Its sources and
      # C bridge are plain C++17, so they are compiled and linked here with the host's compiler on
      # every push, and the four functions iosKit dlsyms checked to be exported.
      - name: Build the Automix analyzer's iOS bridge
        run: |
          lib="$RUNNER_TEMP/libbitchord_analysis.so"
          g++ -std=c++17 -O1 -Wall -shared -fPIC -fvisibility=hidden -Wl,--no-undefined \
            native/analyzer/audio_analysis.cpp native/analyzer/tempo_analysis.cpp \
            native/analyzer/ios/bitchord_analysis_ios.cpp -o "$lib"
          for symbol in bitchord_analysis_abi_version bitchord_analysis_sample_rate bitchord_analysis_run bitchord_analysis_free; do
            nm -D --defined-only "$lib" | grep -qw "$symbol" || { echo "$symbol is not exported"; exit 1; }
          done

      # Started by hand, the live YouTube test runs here too: on the JVM, from GitHub's network,
      # which tells a CI network problem apart from an iOS one without spending macOS minutes.
      - name: Compile for iOS and test on the JVM
        env:
          BITCHORD_LIVE_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: >
          ./gradlew
          :shared:compileKotlinIosArm64
          :shared:compileKotlinIosSimulatorArm64
          :shared:compileTestKotlinIosSimulatorArm64
          :sharedUi:compileKotlinIosArm64
          :iosKit:compileKotlinIosArm64
          :iosKit:compileKotlinIosSimulatorArm64
          :shared:jvmTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-shared-test-reports
          path: shared/build/test-results/

  macos:
    name: Shared · iOS simulator (macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    # Not after the Linux job: the Mac compiles everything itself, so waiting on it only adds its
    # six minutes. Public repository, so the Mac's minutes cost nothing.
    # Apple silicon, so the simulator tests run on iosSimulatorArm64 natively.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # A booted simulator, so the tests have the system's certificate trust (trustd): standalone
      # test runs have none, and every HTTPS request fails validation.
      - name: Boot a simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Booting $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The live test resolves a real YouTube stream and fetches its first bytes: the go/no-go
      # for playback on iOS. The simulator passes on variables prefixed SIMCTL_CHILD_.
      - name: Tests on the simulator and the frameworks
        env:
          SIMCTL_CHILD_BITCHORD_LIVE_YOUTUBE: '1'
        run: >
          ./gradlew
          -Pbitchord.ios.simulator=${{ steps.simulator.outputs.udid }}
          :shared:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64
          :shared:linkReleaseFrameworkIosArm64

      # Kept on success too: the live test's output says which client served iOS.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shared-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/

  app:
    name: iOS app · unsigned IPA (macOS)
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.app || inputs.smoke)) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ios-v'))
    # Beside the Linux job rather than after it, as above.
    runs-on: ${{ inputs.runner || 'macos-15' }}
    permissions:
      # To attach the IPA to the tag's release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle's caches and build cache saved from this branch too (by default only main writes),
      # so a rebuild reuses the compiled klibs and fetched dependencies instead of starting cold.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Turn on Gradle's build cache
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties

      # Kotlin/Native's toolchain and platform libraries, some 1 GB fetched on every cold run.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'shared/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - run: chmod +x gradlew

      # FFmpegBuild's prebuilt frameworks (Opus, Vorbis and DASH playback), for the app to embed;
      # the Kotlin side loads them at runtime, so the Linux job needs none of it.
      - name: Fetch FFmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd iosApp && xcodegen generate

      # Unsigned: sideloading tools (AltStore, SideStore, Sideloadly) sign it with the installer's
      # own Apple ID. The Kotlin framework is built by the project's own build phase.
      - name: Build the unsigned IPA
        if: github.event_name != 'workflow_dispatch' || inputs.app
        env:
          # Empty in a fork without them: the app then asks for the listener's own key.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          xcodebuild -project iosApp/BitChord.xcodeproj -scheme BitChord \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            BITCHORD_LASTFM_API_KEY="$LASTFM_API_KEY" BITCHORD_LASTFM_SECRET="$LASTFM_SECRET" \
            build
          mkdir -p build/ipa/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/BitChord.app build/ipa/Payload/
          # Ad-hoc signed, inside out, with the App Group entitlement: no certificate, so still
          # needs the installer's own signing, but tools that keep an app's entitlements (AltStore,
          # SideStore) then register the group the widget reads the song from.
          app=build/ipa/Payload/BitChord.app
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements iosApp/Widget/BitChordWidget.entitlements "$app/PlugIns/BitChordWidget.appex"
          codesign --force --sign - --entitlements iosApp/BitChord.entitlements "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep application-groups >/dev/null || { echo "App Group entitlement missing"; exit 1; }
          (cd build/ipa && zip -qry ../BitChord-unsigned.ipa Payload)
          ls -lh build/BitChord-unsigned.ipa

      - name: Upload the IPA
        if: github.event_name != 'workflow_dispatch' || inputs.app
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-unsigned-ipa
          path: build/BitChord-unsigned.ipa

      - name: Attach the IPA to the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --prerelease --title "BitChord iOS $GITHUB_REF_NAME" \
                 --notes "Unsigned IPA for sideloading (AltStore, SideStore, Sideloadly)."
          gh release upload "$GITHUB_REF_NAME" build/BitChord-unsigned.ipa --clobber

      - name: Publish to the branch's latest pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.app && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ios-port is ios-latest; any other branch gets its own (ios-swiftui-latest), so a trial
          # branch never replaces the IPA the main line published.
          if [ "$GITHUB_REF_NAME" = "ios-port" ]; then TAG=ios-latest; else TAG="${GITHUB_REF_NAME//\//-}-latest"; fi
          # Recreated rather than updated, so its tag points at the commit just built.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/BitChord-unsigned.ipa \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "BitChord iOS (latest ${GITHUB_REF_NAME} build)" \
            --notes "Unsigned IPA built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')), run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Sign it with your own certificate (AltStore, SideStore, Sideloadly, a signing service) to install."

      # iosKit finds the analyzer by dlopen and dlsym, so a framework left out of the app, or one
      # whose bridge isn't exported, only shows as Automix never measuring anything: checked here,
      # after the IPA is out, like the smoke run.
      - name: Check the Automix analyzer is embedded
        if: github.event_name != 'workflow_dispatch' || inputs.app
        run: |
          lib=build/ios-device/Build/Products/Release-iphoneos/BitChord.app/Frameworks/BitChordAnalysis.framework/BitChordAnalysis
          for symbol in bitchord_analysis_abi_version bitchord_analysis_sample_rate bitchord_analysis_run bitchord_analysis_free; do
            nm -gU "$lib" | grep -q " _$symbol\$" || { echo "$symbol is not exported by $lib"; exit 1; }
          done

      # After the IPA, so a smoke failure never costs the deliverable. Plays a track with no taps
      # (see iosKit's Autoplay.kt) and passes when the playhead moves.
      - name: Boot a simulator
        if: github.event_name != 'workflow_dispatch' || (inputs.smoke && inputs.runner != 'macos-15-intel')
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Smoke run on the simulator
        if: github.event_name != 'workflow_dispatch' || (inputs.smoke && inputs.runner != 'macos-15-intel')
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild -project iosApp/BitChord.xcodeproj -scheme BitChord \
            -configuration Debug -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath build/ios-sim \
            build
          xcrun simctl install "$UDID" build/ios-sim/Build/Products/Debug-iphonesimulator/BitChord.app
          mkdir -p build/smoke
          # macOS has no `timeout`: the console runs in the background, then stops; stopping it
          # stops the app too. The app plays a track and walks its pages ten seconds apart (see
          # Autoplay.kt's tourRequested), with a screenshot of each.
          SIMCTL_CHILD_BITCHORD_AUTOPLAY=dQw4w9WgXcQ SIMCTL_CHILD_BITCHORD_TOUR=1 \
            SIMCTL_CHILD_BITCHORD_AUTOSEARCH='daft punk' \
            xcrun simctl launch --console-pty "$UDID" com.music.bitchord > build/smoke/autoplay.log 2>&1 &
          console=$!
          # Each screenshot waits for the app to say it reached the page, then lets it draw.
          for page in home explore category album artist player menu lyrics login settings search; do
            for _ in $(seq 1 40); do
              grep -q "tour: $page" build/smoke/autoplay.log && break
              sleep 1
            done
            sleep 6
            xcrun simctl io "$UDID" screenshot "build/smoke/$page.png" || true
          done
          kill "$console" 2>/dev/null || true
          # A crash leaves its report on the host.
          cp ~/Library/Logs/DiagnosticReports/BitChord* build/smoke/ 2>/dev/null || true
          cat build/smoke/autoplay.log
          grep -E 'autoplay: playing=true .*positionMs=[1-9][0-9]{3,}' build/smoke/autoplay.log
          # The tour reached its last page.
          grep -q 'tour: search' build/smoke/autoplay.log
          # And it is still alive: a crash, even after the music started, fails the run.
          if ls build/smoke/BitChord*.ips >/dev/null 2>&1; then echo "The app crashed"; exit 1; fi

      - name: Upload the smoke run
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke && inputs.runner != 'macos-15-intel'))
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: build/smoke/

