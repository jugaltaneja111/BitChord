# XcodeGen spec for the iOS app; CI generates BitChord.xcodeproj from it (`xcodegen generate`), so
# no project file is kept in the repository. The Kotlin framework, BitChordKit, is built by Gradle
# from the build phase below.
name: BitChord
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - iosApp
      # The widget's buttons, which the app performs (see Shared/PlaybackIntents.swift).
      - Shared
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The phone's translations, so iOS offers BitChord's own language in Settings › BitChord.
        CFBundleLocalizations: [en, es, fr, de, pl, pt, id, hi, ja, ko, ru, zh-Hans, zh-Hant, he, it, tr, th, vi]
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Keeps playing with the screen locked.
        UIBackgroundModes: [audio]
        # Compose draws at the display's full rate (ProMotion) only with this.
        CADisableMinimumFrameDurationOnPhone: true
        # The status bar's style is the application's, not a view controller's: the app sets it from
        # the Theme setting and the screen on top (StatusBarIcons.ios.kt). Until then it follows the
        # iPhone's light or dark, as the launch screen does.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        # Landscape is listed so a music video can go full screen; the app delegate keeps every other
        # screen upright (IosOrientation.kt decides).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # An iPad turns every way, and with all four (and the launch screen) it can share the screen
        # in Split View and Stage Manager; the player takes its two-column shape in landscape.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # One window: the player, the queue and every page are the app's one set, so a second iPad
        # window would be a second view of them fighting over the same state.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Listen Together invites: bitchord://party/CODE, as the phone's intent filter takes them.
        CFBundleURLTypes:
          - CFBundleURLName: com.music.bitchord.party
            CFBundleURLSchemes: [bitchord]
        # Local music: BitChord's Documents folder shows in the Files app (On My iPhone › BitChord),
        # so songs can be copied into its Music folder. Downloads show there too; the app's own data
        # lives in Application Support, out of sight.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # "Open with BitChord" for audio files, from Files and other apps' share sheets: an
        # alternate handler, so it never takes over from the file's own app (IosLocalMusic.openFile).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        # The Replay share sheet's Save button: add-only, the app never reads the library.
        NSPhotoLibraryAddUsageDescription: BitChord saves your Replay picture to your photo library.
        # Last.fm's key and secret, from the repository's secrets when it has them (see ios.yml);
        # empty otherwise, and the app asks the listener for their own.
        BitChordLastfmApiKey: $(BITCHORD_LASTFM_API_KEY)
        BitChordLastfmSecret: $(BITCHORD_LASTFM_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord
        PRODUCT_NAME: BitChord
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Liquid Glass icons the Settings page offers (UIApplication.setAlternateIconName);
        # Xcode writes their CFBundleAlternateIcons entries into the Info.plist.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconGlass AppIconGlassDark AppIconGlassClear AppIconGlassClearDark
        # Where :iosKit:embedAndSignAppleFrameworkForXcode puts the framework for this build.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../iosKit/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, BitChordKit]
        # The Gradle build reads and writes outside the sandboxed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # The App Group the widget reads the song from. CI ad-hoc signs with it, so a sideloading
        # tool that keeps the app's entitlements (AltStore, SideStore) registers the group.
        CODE_SIGN_ENTITLEMENTS: BitChord.entitlements
        # Shared/PlaybackIntents.swift calls into the Kotlin framework only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BITCHORD_APP
    # FFmpegBuild's decoders for what AVPlayer can't play (scripts/fetch-ffmpeg.sh fetches them);
    # dynamic frameworks, so they are embedded beside the app.
    dependencies:
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavcodec.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavformat.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavutil.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibswresample.xcframework
        embed: true
      # Not called by the app, but libavcodec loads them, so they have to be there.
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibdav1d.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibzvbi.xcframework
        embed: true
      # Automix's analyzer, built below; iosKit dlopens it as it does FFmpeg (IosAnalyzerNative).
      - target: BitChordAnalysis
        embed: true
      # Automix's beat and vocal models on ONNX Runtime, built below; dlopened too (IosModels).
      # Their weights are in iosApp/Models (scripts/fetch-models.sh), bundled as resources.
      - target: BitChordModels
        embed: true
      # Automix's loop mix renderer (native/loopmix), built below; dlopened too (IosLoopMixNative).
      - target: BitChordLoopMix
        embed: true
      # The Replay poster's Save button; linked explicitly, as the Kotlin framework is static.
      - sdk: Photos.framework
      # The Now Playing widget, in PlugIns.
      - target: BitChordWidget
        embed: true
      - sdk: WidgetKit.framework
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :iosKit:embedAndSignAppleFrameworkForXcode
  # The home-screen and lock-screen Now Playing widget. iOS 17 for its buttons (App Intents in a
  # widget); on iOS 16 it simply isn't offered. Swift only: it reads what the app writes into the
  # App Group (IosWidget.kt) and never links the Kotlin framework.
  BitChordWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.widget
        PRODUCT_NAME: BitChordWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Widget/BitChordWidget.entitlements
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
  # Automix's native DSP analyzer: the C++ Android and the desktop compile (native/analyzer, whose
  # CMakeLists are app/src/main/cpp and desktopApp/native), with a C bridge in place of their JNI
  # one. A dynamic framework rather than sources of the app, so its exported functions stay exported
  # and unstripped for iosKit's dlsym, exactly as FFmpeg's do. Only the DSP pass: no Beat This! or
  # open-unmix model, which need ONNX Runtime.
  BitChordAnalysis:
    type: framework
    platform: iOS
    # The .cpp files only: the headers are reached by relative #include, and listing them would
    # copy them into the framework as public headers for no reader.
    sources:
      - path: ../native/analyzer/audio_analysis.cpp
      - path: ../native/analyzer/tempo_analysis.cpp
      # The models' front ends: Beat This!'s mel spectrogram, open-unmix's STFT, the resampler.
      - path: ../native/analyzer/mel_spectrogram.cpp
      - path: ../native/analyzer/vocal_spectrogram.cpp
      - path: ../native/analyzer/resampler.cpp
      - path: ../native/analyzer/ios/bitchord_analysis_ios.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.analysis
        PRODUCT_NAME: BitChordAnalysis
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "NO"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        # Optimised in Debug too, as the CMake builds are (-O2/-O3): an -O0 analysis would hold a
        # core for many seconds per track while music plays. Not -ffast-math, which the analyzer's
        # arithmetic is tuned against (see app/src/main/cpp/CMakeLists.txt).
        GCC_OPTIMIZATION_LEVEL: "2"
        # Hidden unless marked: only the bridge's BITCHORD_EXPORT functions are exported.
        GCC_SYMBOLS_PRIVATE_EXTERN: "YES"
  # Automix's loop mix renderer: native/loopmix, which Android builds as libbitchord_loopmix, with
  # a C bridge in place of its JNI one, over Signalsmith Stretch (header-only, native/third_party).
  # Its FFTs run on Accelerate here. A dynamic framework for the same reason as the analyzer.
  BitChordLoopMix:
    type: framework
    platform: iOS
    sources:
      - path: ../native/loopmix/loop_mix_renderer.cpp
      - path: ../native/loopmix/ios/bitchord_loopmix_ios.cpp
    dependencies:
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.loopmix
        PRODUCT_NAME: BitChordLoopMix
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "NO"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../native $(SRCROOT)/../native/third_party"
        # Android's flags (app/src/main/cpp/CMakeLists.txt): -O3 -ffast-math, in Debug too, since
        # it renders in real time.
        GCC_OPTIMIZATION_LEVEL: "3"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -ffast-math -Wno-unused-parameter"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SIGNALSMITH_USE_ACCELERATE=1"
        GCC_SYMBOLS_PRIVATE_EXTERN: "YES"
  # Automix's models: the C bridge in native/models/ios over ONNX Runtime, which is Microsoft's
  # prebuilt onnxruntime.xcframework (scripts/fetch-onnxruntime.sh) linked in statically, so the
  # app carries one framework for it. CoreML is what ORT's CoreML provider links against; the bridge
  # runs on the CPU provider alone.
  BitChordModels:
    type: framework
    platform: iOS
    sources:
      - path: ../native/models/ios/bitchord_models_ios.cpp
    dependencies:
      - framework: ../iosKit/onnxruntime/onnxruntime.xcframework
        embed: false
        link: true
      - sdk: CoreML.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.models
        PRODUCT_NAME: BitChordModels
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "NO"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        HEADER_SEARCH_PATHS: $(SRCROOT)/../iosKit/onnxruntime/include
        GCC_OPTIMIZATION_LEVEL: "2"
        # Hidden unless marked: the bridge's bcm_ functions are all the framework exports.
        GCC_SYMBOLS_PRIVATE_EXTERN: "YES"
        DEAD_CODE_STRIPPING: "YES"
