# XcodeGen spec for the iOS app; CI generates BitChord.xcodeproj from it (`xcodegen generate`), so
# no project file is kept in the repository. The Kotlin framework, BitChordKit, is built by Gradle
# from the build phase below.
name: BitChord
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - iosApp
    scheme: {}
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: BitChord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # Keeps playing with the screen locked.
        UIBackgroundModes: [audio]
        # Compose draws at the display's full rate (ProMotion) only with this.
        CADisableMinimumFrameDurationOnPhone: true
        # The UI is dark; the status bar's style is set here rather than per screen.
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Listen Together invites: bitchord://party/CODE, as the phone's intent filter takes them.
        CFBundleURLTypes:
          - CFBundleURLName: com.music.bitchord.party
            CFBundleURLSchemes: [bitchord]
        # The Replay share sheet's Save button: add-only, the app never reads the library.
        NSPhotoLibraryAddUsageDescription: BitChord saves your Replay picture to your photo library.
        # Last.fm's key and secret, from the repository's secrets when it has them (see ios.yml);
        # empty otherwise, and the app asks the listener for their own.
        BitChordLastfmApiKey: $(BITCHORD_LASTFM_API_KEY)
        BitChordLastfmSecret: $(BITCHORD_LASTFM_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord
        PRODUCT_NAME: BitChord
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Liquid Glass icons the Settings page offers (UIApplication.setAlternateIconName);
        # Xcode writes their CFBundleAlternateIcons entries into the Info.plist.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconGlass AppIconGlassDark AppIconGlassClear AppIconGlassClearDark
        # Where :iosKit:embedAndSignAppleFrameworkForXcode puts the framework for this build.
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../iosKit/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, BitChordKit]
        # The Gradle build reads and writes outside the sandboxed script inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: false
    # FFmpegBuild's decoders for what AVPlayer can't play (scripts/fetch-ffmpeg.sh fetches them);
    # dynamic frameworks, so they are embedded beside the app.
    dependencies:
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavcodec.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavformat.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibavutil.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibswresample.xcframework
        embed: true
      # Not called by the app, but libavcodec loads them, so they have to be there.
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibdav1d.xcframework
        embed: true
      - framework: ../iosKit/ffmpeg/FFmpegBuild/Sources/AetherLibzvbi.xcframework
        embed: true
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :iosKit:embedAndSignAppleFrameworkForXcode
